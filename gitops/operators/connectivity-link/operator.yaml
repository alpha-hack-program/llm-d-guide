# RHCL 1.3.5+ required for RHOAI 3.5 MaaS (Wasm shim bug fixed in 1.3.5).
# Pin to 1.3.x for reproducibility; Manual approval prevents surprise channel-head upgrades.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Manual
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: rhcl-operator.v1.3.6
