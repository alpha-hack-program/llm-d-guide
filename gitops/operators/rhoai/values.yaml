# Red Hat OpenShift AI operator (OLM subscription).
#
# Default path is GA on stable-3.x (olmProfile: stable). For early access,
# set olmProfile: ea (alpha channel), or export RHOAI_OLM_PROFILE=ea and
# pass --set olmProfile=$RHOAI_OLM_PROFILE to helm.
#
# --- Combination reference (pin or override with channel + startingCSV) ---
#
# GA stable 3.5 (default):
#   channel: stable-3.x
#   startingCSV: rhods-operator.3.5.0
#
# Early access (alpha channel — 'beta' is legacy, do not use):
#   channel: alpha
#   startingCSV: <ea-csv-version>
#
# To use EA from defaults, switch olmProfile (see commented line below).

# olmVersion: OLM install method — "v0" (Subscription, OCP 4.20) or "v1" (ClusterExtension, OCP 4.21+)
olmVersion: v0

olmProfile: stable
# olmProfile: ea

presets:
  stable:
    channel: stable-3.x
    startingCSV: rhods-operator.3.5.0
  ea:
    channel: alpha
    startingCSV: ""

# Optional: set both to override olmProfile (leave empty to use preset)
channel: ""
startingCSV: ""

subscription:
  name: rhods-operator
  installPlanApproval: Manual
  source: redhat-operators
  sourceNamespace: openshift-marketplace

namespace:
  name: redhat-ods-operator
  displayName: Red Hat OpenShift AI

operatorGroup:
  name: rhods-operator

# --- Copy-paste overrides (optional): set both channel and startingCSV, or use olmProfile above.
# GA stable 3.5:
# channel: stable-3.x
# startingCSV: rhods-operator.3.5.0
#
# Early access (alpha channel):
# channel: alpha
# startingCSV: <ea-csv-version>
