apiVersion: v1
kind: Namespace
metadata:
  annotations:
    openshift.io/display-name: Red Hat OpenShift Cluster Observability Operator
  labels:
    openshift.io/cluster-monitoring: "true"
  name: openshift-cluster-observability-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
spec: {}
---
# COO pin removed for RHOAI 3.5 — the perses image shipped with 3.5 supports
# newer COO versions. Previously pinned to 1.4.0 due to a --web.tls-min-version
# flag incompatibility with the RHOAI 3.4.1 perses image.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-cluster-observability-operator
  namespace: openshift-cluster-observability-operator
spec:
  channel: stable
  installPlanApproval: Manual  # Manual approval required to prevent surprise upgrades
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
