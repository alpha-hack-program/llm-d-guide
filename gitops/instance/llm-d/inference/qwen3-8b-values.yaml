deploymentType: intelligent-inference
serviceName: qwen3-8b
# replicas: 2 assumes 3-AZ clusters with 1 GPU node per AZ (3 total).
# Single-AZ / single GPU node clusters: override with --set replicas=1 on helm template.
replicas: 2

updateStrategy: Recreate

model:
  name: alibaba/qwen3-8b

storage:
  type: oci
  uri: oci://registry.redhat.io/rhelai1/modelcar-qwen3-8b-fp8-dynamic:1.5

resources:
  limits:
    cpu: "6"
    memory: 24Gi
    gpuCount: "1"
  requests:
    cpu: "6"
    memory: 24Gi
    gpuCount: "1"

hardwareProfile:
  namespace: redhat-ods-applications
  name: gpu-profile

vllm:
  prefixCaching:
    enabled: auto  # Auto-enabled for intelligent-inference
  extraArgs:
    - "--disable-access-log-for-endpoints=/health,/metrics,/ping"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser=hermes"

# Gateway config is pre-filled so you only need --set maas.enabled=true to enable MaaS.
# The gateway ref is only added to the LLMInferenceService when maas.enabled is true.
maas:
  enabled: false
  gateway:
    name: maas-default-gateway
    namespace: openshift-ingress
