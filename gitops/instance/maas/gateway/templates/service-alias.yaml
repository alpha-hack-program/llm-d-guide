{{- if .Values.gateway.enabled }}
{{- if ne .Values.gateway.className .Values.gateway.name }}
---
# Istio creates the gateway service as <gateway-name>-<class-name>.
# maas-api looks it up by exact gateway name. This alias bridges the gap.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  selector:
    gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: status
    port: 15021
    targetPort: 15021
{{- end }}
{{- end }}
