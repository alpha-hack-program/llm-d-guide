apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app.kubernetes.io/part-of: mcp-gateway
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ .Values.gateway.name }}-override-config
  {{- $root := . }}
  {{- /*
  Every OIDC-enabled tenant's internal "-mcps" listener has no hostname, so
  Gateway API's port+protocol+hostname uniqueness rule collapses to "port
  must be unique" across that whole set. The default tenant's mcps listener
  (when oidc.issuer is set) always claims gateway.port; every OIDC-enabled
  extraTenants[] entry must set its own distinct port, checked here so a
  collision fails with a clear message instead of a cryptic Gateway API
  admission rejection.
  */}}
  {{- $mcpsPorts := dict }}
  {{- if .Values.oidc.issuer }}
  {{- $mcpsPorts = set $mcpsPorts (toString .Values.gateway.port) "default" }}
  {{- end }}
  {{- range $t := .Values.extraTenants }}
  {{- $tenant := include "mcp-gateway.extraTenant" (dict "tenant" $t "root" $root) | fromYaml }}
  {{- if and $tenant.enabled $tenant.oidcIssuer }}
  {{- $port := required (printf "extraTenants[%s].port is required when oidcIssuer is set — every OIDC-enabled tenant's hostless \"mcps\" listener needs its own port, distinct from gateway.port and every other OIDC-enabled tenant's port" $tenant.name) $tenant.port }}
  {{- if hasKey $mcpsPorts (toString $port) }}
  {{- fail (printf "extraTenants[%s].port %v collides with tenant %q's mcps listener port — every OIDC-enabled tenant needs a unique port" $tenant.name $port (get $mcpsPorts (toString $port))) }}
  {{- end }}
  {{- $mcpsPorts = set $mcpsPorts (toString $port) $tenant.name }}
  {{- end }}
  {{- end }}
  {{- /*
  Confirmed live: the MCP Gateway Operator allows only one
  MCPGatewayExtension per NAMESPACE (not per Gateway, despite the install
  guide's own ambiguous wording) — a second one in the same namespace sits
  at Ready: False with status message "conflict: namespace <ns> already has
  MCPGatewayExtension <name> (only one per namespace allowed)". Every
  enabled tenant (default included) must use a distinct extensionNamespace;
  checked here so a collision fails at template time with a clear message
  instead of a confusing live Ready: False discovered after the fact.
  */}}
  {{- $extensionNamespaces := dict .Values.extension.namespace "default" }}
  {{- range $t := .Values.extraTenants }}
  {{- $tenant := include "mcp-gateway.extraTenant" (dict "tenant" $t "root" $root) | fromYaml }}
  {{- if $tenant.enabled }}
  {{- $extNs := required (printf "extraTenants[%s].extensionNamespace is required — it has no default (unlike this chart's other namespace fields), since defaulting it would guarantee a collision with the default tenant's own extension namespace" $tenant.name) $tenant.extensionNamespace }}
  {{- if hasKey $extensionNamespaces $extNs }}
  {{- fail (printf "extraTenants[%s].extensionNamespace %q collides with tenant %q's MCPGatewayExtension namespace — the MCP Gateway Operator allows only one MCPGatewayExtension per namespace, every enabled tenant needs a distinct extensionNamespace" $tenant.name $extNs (get $extensionNamespaces $extNs)) }}
  {{- end }}
  {{- $extensionNamespaces = set $extensionNamespaces $extNs $tenant.name }}
  {{- end }}
  {{- end }}
  listeners:
    - name: mcp
      hostname: {{ required "gateway.publicHost is required, e.g. mcp.apps.<cluster-domain>" .Values.gateway.publicHost | quote }}
      port: {{ .Values.gateway.port }}
      protocol: HTTP
      allowedRoutes:
        {{- include "mcp-gateway.allowedRoutes" . | nindent 8 }}
    {{- if .Values.oidc.issuer }}
    - name: mcps
      port: {{ .Values.gateway.port }}
      protocol: HTTP
      allowedRoutes:
        {{- include "mcp-gateway.allowedRoutes" . | nindent 8 }}
    {{- end }}
    {{- range $t := .Values.extraTenants }}
    {{- $tenant := include "mcp-gateway.extraTenant" (dict "tenant" $t "root" $root) | fromYaml }}
    {{- if $tenant.enabled }}
    - name: {{ $tenant.name }}-mcp
      hostname: {{ required (printf "extraTenants[%s].publicHost is required, e.g. mcp.apps.<cluster-domain>" $tenant.name) $tenant.publicHost | quote }}
      port: {{ if $tenant.oidcIssuer }}{{ $tenant.port }}{{ else }}{{ $root.Values.gateway.port }}{{ end }}
      protocol: HTTP
      allowedRoutes:
        {{- include "mcp-gateway.allowedRoutes" $root | nindent 8 }}
    {{- if $tenant.oidcIssuer }}
    - name: {{ $tenant.name }}-mcps
      port: {{ $tenant.port }}
      protocol: HTTP
      allowedRoutes:
        {{- include "mcp-gateway.allowedRoutes" $root | nindent 8 }}
    {{- end }}
    {{- end }}
    {{- end }}
